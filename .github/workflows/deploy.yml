name: build & deploy

# Build image amd64 NATIVE trên runner GitHub (không QEMU, không đụng máy Mac)
# rồi ssh vào VPS deploy. main -> prod (có duyệt), develop -> staging (tự động).
on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/pinnguyen9x/learn-nextjs
  # Host/user để trong Actions Variables (Settings > Variables), không hard-code IP trong repo public
  VPS: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Xác định môi trường & tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=prod-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pinnguyen9x
          password: ${{ secrets.GHCR_PAT }}

      # Build -> kiểm -> push, tách làm ba bước: image chứa content private của khu
      # /me thì dừng ở bước kiểm, KHÔNG BAO GIỜ lên ghcr (repo + image đều public).
      - name: Build (amd64 native, chưa push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          build-args: |
            API_URL=http://json-server-blog:4000
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          load: true
          push: false

      - name: Kiểm image không chứa content private
        run: scripts/check-image-private.sh "$IMAGE:${{ steps.meta.outputs.tag }}"

      - name: Push
        run: docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # main -> environment "production" (bật Required reviewers = cổng duyệt)
    # develop -> "staging" (không reviewer = tự động)
    # url: để GitHub hiện link deployment (nipit.pro) ở trang Environments/Deployments
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://nipit.pro' || format('http://{0}:3001', vars.VPS_HOST) }}
    steps:
      # Cần docker-compose.yml của chính commit này để scp lên VPS (job này chạy
      # trên runner khác job build — không có sẵn workspace).
      - uses: actions/checkout@v4

      - name: Chuẩn bị SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy lên VPS
        run: |
          TAG='${{ needs.build-push.outputs.tag }}'
          # BIND: prod chỉ nghe 127.0.0.1 (nginx đứng trước); staging mở thẳng IP:3001.
          # LOG_MODE: staging dùng chung thư mục practice-log với prod -> mount ro.
          if [ "${{ github.ref_name }}" = "main" ]; then
            DIR=/opt/learn-nextjs; CON=learn-nextjs; PORT=3000; API=http://json-server-blog:4000
            BIND=127.0.0.1; LOG_MODE=rw
          else
            DIR=/opt/learn-nextjs-staging; CON=learn-nextjs-staging; PORT=3001; API=http://json-server-blog-staging:4000
            BIND=0.0.0.0; LOG_MODE=ro
          fi
          # Compose trong repo là nguồn duy nhất: chép lên trước mỗi lần deploy, ghi
          # đè bản trên VPS. KHÔNG đụng $DIR/.env (cấu hình riêng từng môi trường).
          scp -o StrictHostKeyChecking=no docker-compose.yml "$VPS:$DIR/docker-compose.yml"
          # touch không sửa file đã có: .env.private của prod giữ nguyên secrets.
          # Thiếu file thì compose dừng hẳn ("env file not found") -> cả site sập;
          # có file rỗng thì site chạy, chỉ khu /me tắt (staging luôn ở trạng thái này).
          #
          # Service cloudflared CỐ Ý không xuất hiện ở đây. Nó nằm sau `profiles:
          # ['tunnel']`, bật bằng COMPOSE_PROFILES=tunnel trong $DIR/.env trên VPS —
          # file mà deploy.yml không đụng tới. Hệ quả mong muốn:
          #   - staging: không có biến đó -> cloudflared không khởi động, không cần
          #     TUNNEL_TOKEN, job không thể fail vì thiếu secret;
          #   - prod: profile đọc từ $DIR/.env nên CI không thể vô tình kéo tunnel
          #     xuống. Tunnel chết = cả site chết, vì 80/443 đã đóng ở ufw.
          # Đừng export COMPOSE_PROFILES ở đây: env của shell đè .env, làm mất đúng
          # tính chất vừa nói. Xem docs/cloudflare.md.
          ssh -o StrictHostKeyChecking=no "$VPS" "
            docker network create webnet 2>/dev/null || true
            export IMAGE=$IMAGE:$TAG CONTAINER=$CON HOST_PORT=$PORT API_TARGET=$API BIND_ADDR=$BIND PRACTICE_LOG_MODE=$LOG_MODE
            cd $DIR && touch .env.private && docker compose pull && docker compose up -d --remove-orphans && docker image prune -af
          "
