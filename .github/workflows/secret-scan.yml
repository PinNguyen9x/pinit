name: secret-scan

# Bổ sung cho secret scanning của GitHub, KHÔNG thay thế nó.
# GitHub đã bật sẵn secret scanning + push protection và bắt tốt token của các nhà
# cung cấp lớn. Job này chỉ lo hai thứ GitHub không coi là secret:
#   - IPv4 public  -> với repo này là thông tin hạ tầng (IP VPS)
#   - plane_api_*  -> mẫu riêng, không nằm trong danh sách nhà cung cấp
#
# Chạy trên pull_request vì deploy.yml chỉ chạy on:push vào main/develop — tức là
# chặn khi code đã lên nhánh chính, quá muộn.
on:
  pull_request:
    branches: [main, develop]

# Không cần quyền ghi gì cả; chỉ đọc code.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0: cần lịch sử đầy đủ thì `origin/<base>...HEAD` mới tính được
          # merge-base. Mặc định checkout chỉ lấy 1 commit -> range rỗng, job xanh giả.
          fetch-depth: 0

      - name: Quét secret trong diff của PR
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=0 origin "$BASE"
          # Ba chấm: chỉ commit của PR, không tính commit mới của base.
          ./scripts/scan-secrets.sh "origin/$BASE...HEAD"
