services:
  web:
    image: ${IMAGE:-ghcr.io/pinnguyen9x/learn-nextjs:latest}
    container_name: ${CONTAINER:-learn-nextjs}
    restart: unless-stopped
    ports:
      # Prod: 3000, Staging: 3001 (map ra host); trong container luôn 3000
      # BIND_ADDR mặc định 127.0.0.1 = ẩn khỏi internet (prod đi qua nginx :443).
      # Staging cần truy cập trực tiếp IP:3001 -> deploy set BIND_ADDR=0.0.0.0
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    # Secrets khu /me (OWNER_PASSWORD_HASH, SESSION_SECRET, ANTHROPIC_API_KEY,
    # TRUST_PROXY) — file nằm cạnh compose trên VPS, chmod 600, KHÔNG có trong repo.
    # Prod có nội dung; staging là file rỗng (deploy.yml `touch`) nên /me tắt ở
    # staging. Hash bcrypt trong file này phải bọc nháy đơn — xem docs/private-area.md.
    env_file:
      - .env.private
    environment:
      - NODE_ENV=production
      # Gọi backend qua tên container trên webnet (prod: json-server-blog, staging: json-server-blog-staging)
      - API_URL=${API_TARGET:-http://json-server-blog:4000}
      # Next standalone bind vào HOSTNAME; Docker đặt = container ID -> ép 0.0.0.0
      - HOSTNAME=0.0.0.0
      - PRIVATE_CONTENT_DIR=/app/private-content
      - PRACTICE_LOG_PATH=/app/practice-data/practice-log.jsonl
    volumes:
      # Content private: chỉ đọc. Repo + image đều public, content chỉ sống ở đây.
      - /srv/pinit-private/content:/app/private-content:ro
      # Log practice: thư mục riêng (chown 1001:1001 = user nextjs trong image).
      # Mount THƯ MỤC, không mount file đơn: file chưa có trên host thì Docker tạo
      # một thư mục trùng tên và app ghi log lỗi EISDIR. Prod rw; staging dùng
      # chung thư mục nên deploy.yml export PRACTICE_LOG_MODE=ro — không ghi nhầm.
      - /srv/pinit-private/practice-log:/app/practice-data:${PRACTICE_LOG_MODE:-rw}
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cloudflare Tunnel — đường vào duy nhất sau khi đóng 80/443 ở ufw (xem
  # docs/cloudflare.md). cloudflared mở kết nối RA Cloudflare, nên origin không
  # cần cổng inbound nào.
  cloudflared:
    # Ghim tag: bản đang chạy trên prod từ 06/10/2026. KHÔNG dùng :latest —
    # restart: unless-stopped + :latest nghĩa là một lần `compose pull` bất kỳ có
    # thể đổi version của đường vào duy nhất vào site, không ai chủ ý.
    # Nâng cấp thì sửa tag ở đây, có PR, chứ đừng để nó tự trôi.
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    container_name: ${CF_CONTAINER:-cloudflared}
    restart: unless-stopped
    # Chỉ chạy khi profile `tunnel` được bật. Bật bằng COMPOSE_PROFILES=tunnel
    # trong $DIR/.env trên VPS — KHÔNG phải trong deploy.yml: deploy.yml không
    # đụng $DIR/.env, nên một lần deploy quên biến cũng không thể kéo tunnel
    # xuống (mà tunnel xuống = cả site chết, vì 80/443 đã đóng).
    # Staging không có dòng đó -> service không bao giờ khởi động, không cần token.
    profiles: ['tunnel']
    # nginx chạy TRÊN HOST, không trong Docker. Bridge network không thấy
    # loopback của host, nên phải dùng host network để tới 127.0.0.1:80.
    # Kèm lợi ích: $remote_addr mà nginx thấy là 127.0.0.1 -> set_real_ip_from
    # chỉ cần tin loopback, xem scripts/cloudflare-realip.sh.
    network_mode: host
    # TUNNEL_TOKEN nằm trong .env.private (chmod 600) cùng các secret khác của /me.
    # Tên biến là TUNNEL_TOKEN vì cloudflared đọc đúng tên này từ env; đổi tên
    # cần bọc entrypoint bằng shell, mà image có thể là distroless.
    env_file:
      - .env.private
    # --no-autoupdate: trong container thì nâng cấp là việc của image, không phải
    # của process đang chạy (autoupdate tự restart, mất tunnel giữa lúc đang phục vụ).
    # --metrics: để kiểm sức khoẻ từ host bằng `curl http://127.0.0.1:20241/ready`
    # (không đặt healthcheck vì image không chắc có wget/curl bên trong).
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run

# Network dùng chung prod + staging + backend (tạo sẵn: docker network create webnet)
networks:
  webnet:
    external: true
